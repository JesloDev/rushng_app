; ================================================================
; RUSHNG - Supervisor Configuration
; ================================================================

[program:rushng-api]
; Command to run
command=/var/www/rushng-api/venv/bin/gunicorn -c /var/www/rushng-api/gunicorn.conf.py wsgi:app

; Directory
directory=/var/www/rushng-api

; User to run as
user=www-data

; Environment variables
environment=PATH="/var/www/rushng-api/venv/bin",ENVIRONMENT="production"

; Auto-start and restart
autostart=true
autorestart=true
startsecs=10

; Stop behavior
stopasgroup=true
killasgroup=true
stopwaitsecs=60

; Logging
stderr_logfile=/var/log/rushng-api/err.log
stdout_logfile=/var/log/rushng-api/out.log
stderr_logfile_maxbytes=10MB
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5

; Process priority
priority=999

; ================================================================
; Celery Worker (for background tasks)
; ================================================================

[program:rushng-celery]
command=/var/www/rushng-api/venv/bin/celery -A app.celery worker --loglevel=info
directory=/var/www/rushng-api
user=www-data
autostart=true
autorestart=true
startsecs=10
stopasgroup=true
killasgroup=true
stderr_logfile=/var/log/rushng-api/celery-err.log
stdout_logfile=/var/log/rushng-api/celery-out.log

; ================================================================
; Redis (if not managed by systemd)
; ================================================================

[program:redis]
command=/usr/bin/redis-server
autostart=true
autorestart=true
user=redis
redirect_stderr=true
stdout_logfile=/var/log/redis/redis-server.log