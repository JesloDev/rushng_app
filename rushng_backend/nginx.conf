# ================================================================
# RUSHNG API - Nginx Configuration
# ================================================================

upstream rushng_api {
    # Gunicorn server (Unix socket)
    server unix:/var/run/rushng-api.sock fail_timeout=0;
    
    # Or use TCP (if using TCP binding)
    # server 127.0.0.1:8000 fail_timeout=0;
}

upstream rushng_frontend {
    # Next.js frontend (if hosted on same server)
    server 127.0.0.1:3000 fail_timeout=0;
}

# ================================================================
# Main server block (HTTPS)
# ================================================================

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.rushng.com;

    # ========== SSL Certificates ==========
    ssl_certificate /etc/nginx/ssl/rushng.com.crt;
    ssl_certificate_key /etc/nginx/ssl/rushng.com.key;
    
    # SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    
    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ========== Logging ==========
    access_log /var/log/nginx/rushng-api.access.log;
    error_log /var/log/nginx/rushng-api.error.log;

    # ========== Client Settings ==========
    client_max_body_size 10M;
    client_body_timeout 60s;
    client_header_timeout 60s;
    keepalive_timeout 65s;
    send_timeout 60s;

    # ========== Main API ==========
    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_pass http://rushng_api;
        proxy_redirect off;
        proxy_buffering off;
        
        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # ========== Health Check (no logging) ==========
    location /health {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://rushng_api/health;
        proxy_redirect off;
        access_log off;
    }

    # ========== Static Files (if any) ==========
    location /static/ {
        alias /var/www/rushng-api/static/;
        expires 30d;
        access_log off;
    }

    # ========== Favicon ==========
    location /favicon.ico {
        return 204;
        access_log off;
        log_not_found off;
    }

    # ========== Robots.txt ==========
    location /robots.txt {
        return 200 "User-agent: *\nAllow: /\n";
        access_log off;
    }

    # ========== Block common attacks ==========
    location ~* \.(htaccess|htpasswd|git|svn|env)$ {
        return 404;
    }
}

# ================================================================
# HTTP to HTTPS redirect
# ================================================================

server {
    listen 80;
    listen [::]:80;
    server_name api.rushng.com;
    
    # Redirect all HTTP to HTTPS
    return 301 https://$server_name$request_uri;
}

# ================================================================
# Frontend server (if hosting Next.js on same server)
# ================================================================

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name rushng.com www.rushng.com;

    # SSL configuration (same as above)
    ssl_certificate /etc/nginx/ssl/rushng.com.crt;
    ssl_certificate_key /etc/nginx/ssl/rushng.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Logging
    access_log /var/log/nginx/rushng-frontend.access.log;
    error_log /var/log/nginx/rushng-frontend.error.log;

    # Client settings
    client_max_body_size 10M;

    # Proxy to Next.js
    location / {
        proxy_pass http://rushng_frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # Next.js specific
        proxy_buffering off;
        proxy_redirect off;
    }

    # API proxy (optional - if you want to proxy API through frontend domain)
    location /api/ {
        proxy_pass http://rushng_api/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# ================================================================
# Rate Limiting
# ================================================================

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;

# Apply rate limiting to specific locations (add inside server block)
# limit_req zone=api_limit burst=20 nodelay;
# limit_req zone=auth_limit burst=5 nodelay;