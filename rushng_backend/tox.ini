[tox]
envlist = py38,py39,py310,py311
skipsdist = True

[testenv]
deps =
    -rrequirements-dev.txt
commands =
    pytest tests/ -v --cov=app --cov-report=term

[testenv:lint]
deps =
    flake8
    pylint
    black
    isort
commands =
    flake8 app/
    pylint app/
    black --check app/
    isort --check-only app/

[testenv:coverage]
deps = -rrequirements-dev.txt
commands =
    pytest tests/ --cov=app --cov-report=html --cov-report=term